openapi: 3.2.0
info:
  title: ChannelShipper & Royal Mail Public Version API
  description: Import your orders, retrieve your orders and generate labels.
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: Version
paths:
  /version:
    get:
      tags:
      - Version
      summary: Get API version details
      operationId: GetVersionAsync
      responses:
        '200':
          description: Returns details about the API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVersionResource'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      required:
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
    GetVersionResource:
      required:
      - releaseDate
      type: object
      properties:
        commit:
          type: string
        build:
          type: string
        release:
          type: string
        releaseDate:
          type: string
          format: date-time
  securitySchemes:
    Bearer:
      type: apiKey
      description: Authorization header using the Bearer scheme. Enter 'Bearer [space] and then your token.
      name: Authorization
      in: header
