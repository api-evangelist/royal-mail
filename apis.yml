apis:
- name: Royal Mail API Shipping V2 (REST)
  description: >-
    A fully RESTful service enabling account customers to create domestic and international shipments,
    produce shipping labels, print customs documents, manifest shipments, pre-allocate tracking numbers,
    and request offline barcode ranges. Requires an Online Business Account (OBA).
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.royalmail.net/taxonomy/term/91
  baseURL: https://api.royalmail.net/shipping/v2
  tags:
  - Shipping
  - Labels
  - Manifests
  - Barcodes
  - International
  properties:
  - type: Documentation
    url: https://developer.royalmail.net/taxonomy/term/91
  - type: Authentication
    url: https://developer.royalmail.net/start
  contact:
