    url: https://developer.royalmail.net/help
    email: ''
  overlays: []
  aid: royal-mail:royal-mail-api-shipping-v2-rest
- name: Royal Mail Tracking V2 (REST)
  description: >-
    Allows account customers to receive track-and-trace information for mail items, including current
    status, delivery history, and proof of delivery for single or multiple items. Intended for server-side
    application use.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.royalmail.net/product/175625/api/76888
