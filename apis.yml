- name: Royal Mail Barcode Allocation V1 (REST)
  description: >-
    A RESTful web service that enables API consumers to request a pre-allocated range of Royal Mail barcodes
    for offline use in shipping processes. No usage costs to customers; development costs are covered
    by the customer.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.royalmail.net/taxonomy/term/61
  baseURL: https://api.royalmail.net
