- name: Royal Mail Local Collect V3 (REST)
  description: >-
    Enables customers to benefit from Click and Collect delivery options by retrieving current lists of
    participating Post Offices and Royal Mail Customer Service Points where tracked and special delivery
    parcels can be collected. No usage costs to customers.
